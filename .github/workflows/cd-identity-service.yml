name: CD - Identity Service

on:
  push:
    branches:
      - main
    paths:
      - .github/service-registry.json
      - .github/workflows/**
      - infra/ci/**
      - infra/k8s/identity-service/**
      - backend/apps/control-plane/identity-service/**
      - packages/**
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml

concurrency:
  group: cd-identity-service-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect:
    name: Detect Deployable Changes
    uses: ./.github/workflows/ci-detect-changes.yml
    with:
      base_sha: ${{ github.event.before }}
      head_sha: ${{ github.sha }}

  build-and-push:
    name: Build and Publish Identity Service
    runs-on: ubuntu-latest
    needs: detect
    if: ${{ needs.detect.outputs.identity_deploy_changed == 'true' }}
    permissions:
      contents: read
      packages: write
    outputs:
      image_repository: ${{ steps.meta.outputs.image_repository }}
      image_tag_sha: ${{ steps.meta.outputs.image_tag_sha }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image metadata
        id: meta
        env:
          REPOSITORY_OWNER: ${{ github.repository_owner }}
          IMAGE_TAG_SHA: ${{ github.sha }}
        run: |
          IMAGE_OWNER="$(echo "$REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')"
          IMAGE_REPOSITORY="ghcr.io/$IMAGE_OWNER/ar-monitoring-identity-service"
          echo "image_repository=$IMAGE_REPOSITORY" >> "$GITHUB_OUTPUT"
          echo "image_tag_sha=$IMAGE_TAG_SHA" >> "$GITHUB_OUTPUT"

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: backend/apps/control-plane/identity-service
          file: backend/apps/control-plane/identity-service/Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.image_repository }}:${{ steps.meta.outputs.image_tag_sha }}
            ${{ steps.meta.outputs.image_repository }}:dev
            ${{ steps.meta.outputs.image_repository }}:latest-main
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Write image summary
        run: |
          {
            echo "## Published Image"
            echo ""
            echo "- repository: \`${{ steps.meta.outputs.image_repository }}\`"
            echo "- immutable tag: \`${{ steps.meta.outputs.image_tag_sha }}\`"
            echo "- mutable tags: \`dev\`, \`latest-main\`"
          } >> "$GITHUB_STEP_SUMMARY"

  deploy-dev:
    name: Deploy Identity Service to Dev
    runs-on: ubuntu-latest
    needs:
      - detect
      - build-and-push
    if: ${{ needs.detect.outputs.identity_deploy_changed == 'true' }}
    environment: dev
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: latest

      - name: Configure kubeconfig
        env:
          KUBE_CONFIG_DATA: ${{ secrets.KUBE_CONFIG }}
        run: |
          mkdir -p "$HOME/.kube"
          printf '%s' "$KUBE_CONFIG_DATA" > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"

      - name: Apply base manifests
        run: |
          kubectl apply -f infra/k8s/identity-service/namespace.yaml
          kubectl apply -f infra/k8s/identity-service/configmap.yaml
          kubectl apply -f infra/k8s/identity-service/service.yaml
          kubectl apply -f infra/k8s/identity-service/deployment.yaml

      - name: Update deployment image
        env:
          K8S_NAMESPACE: ar-monitoring-dev
          IMAGE_REPOSITORY: ${{ needs.build-and-push.outputs.image_repository }}
          IMAGE_TAG_SHA: ${{ needs.build-and-push.outputs.image_tag_sha }}
        run: |
          kubectl set image deployment/identity-service identity-service="$IMAGE_REPOSITORY:$IMAGE_TAG_SHA" -n "$K8S_NAMESPACE"
          kubectl rollout status deployment/identity-service -n "$K8S_NAMESPACE" --timeout=180s

      - name: Write deploy summary
        env:
          K8S_NAMESPACE: ar-monitoring-dev
          IMAGE_REPOSITORY: ${{ needs.build-and-push.outputs.image_repository }}
          IMAGE_TAG_SHA: ${{ needs.build-and-push.outputs.image_tag_sha }}
        run: |
          {
            echo "## Dev Deployment"
            echo ""
            echo "- namespace: \`$K8S_NAMESPACE\`"
            echo "- image: \`$IMAGE_REPOSITORY:$IMAGE_TAG_SHA\`"
            echo "- rollback: redeploy a prior SHA tag with \`kubectl set image\`"
          } >> "$GITHUB_STEP_SUMMARY"
