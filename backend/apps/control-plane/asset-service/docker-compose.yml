services:
  asset-service:
    build:
      context: ../..
      dockerfile: control-plane/asset-service/Dockerfile
    env_file:
      - .env.example
    environment:
      ASSET_MONGODB_URI: mongodb://mongo:27017/asset_db
    ports:
      - "4002:4002"
    depends_on:
      mongo:
        condition: service_healthy

  mongo:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - asset-service-mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  asset-service-mongo-data:
