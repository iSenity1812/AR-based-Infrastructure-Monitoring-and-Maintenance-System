events {}

http {
    log_format grpc_json escape=json
        '{"time":"$time_iso8601","remote":"$remote_addr","status":$status,'
        '"client_dn":"$ssl_client_s_dn","request_time":"$request_time"}';

    access_log /var/log/nginx/access.log grpc_json;
    error_log /var/log/nginx/error.log warn;

    upstream ingestion_worker_grpc {
        server host.docker.internal:4040;
    }

    server {
        listen 8443 ssl;
        http2 on;
        server_name local-ingestion.local localhost 127.0.0.1;

        ssl_certificate /etc/nginx/certs/server.crt;
        ssl_certificate_key /etc/nginx/certs/server.key;
        ssl_client_certificate /etc/nginx/certs/ca.crt;
        ssl_verify_client optional;
        ssl_protocols TLSv1.2 TLSv1.3;

        location / {
            grpc_set_header Host $host;
            grpc_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            grpc_set_header X-Forwarded-Proto https;
            grpc_set_header X-Client-Cert-DN $ssl_client_s_dn;
            grpc_pass grpc://ingestion_worker_grpc;
        }
    }

    server {
        listen 9443 ssl;
        http2 on;
        server_name local-ingestion-mtls.local localhost 127.0.0.1;

        ssl_certificate /etc/nginx/certs/server.crt;
        ssl_certificate_key /etc/nginx/certs/server.key;
        ssl_client_certificate /etc/nginx/certs/ca.crt;
        ssl_verify_client on;
        ssl_protocols TLSv1.2 TLSv1.3;

        location / {
            grpc_set_header Host $host;
            grpc_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            grpc_set_header X-Forwarded-Proto https;
            grpc_set_header X-Client-Cert-DN $ssl_client_s_dn;
            grpc_pass grpc://ingestion_worker_grpc;
        }
    }
}
