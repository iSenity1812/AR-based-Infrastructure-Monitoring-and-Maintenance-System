apiVersion: 1

groups:
  - orgId: 1
    name: monitoring_node_health_v1
    folder: delegated-alerting-v1
    interval: 60s
    rules:
      - uid: node_stale_v1
        title: NodeStale
        condition: C
        data:
          - refId: A
            datasourceUid: clickhouse
            model:
              datasource:
                type: grafana-clickhouse-datasource
                uid: clickhouse
              editorType: sql
              format: table
              intervalMs: 1000
              maxDataPoints: 43200
              queryType: sql
              rawQuery: true
              rawSql: |
                SELECT
                    node_id,
                    ifNull(dictGet('telemetry_db.dict_node_topology', 'rack_id', node_id), '') AS rack_id,
                    toFloat64(dateDiff('second', summary_ts, now())) AS alert_value
                FROM telemetry_db.node_current_summary
                WHERE dateDiff('second', summary_ts, now()) > 120
              refId: A
            relativeTimeRange:
              from: 120
              to: 0
          - refId: C
            datasourceUid: __expr__
            model:
              datasource:
                type: __expr__
                uid: __expr__
              expression: $A > 0
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
              type: math
            relativeTimeRange:
              from: 0
              to: 0
        noDataState: OK
        execErrState: Error
        for: 0s
        annotations:
          summary: "Node {{ $labels.node_id }} stale for {{ printf \"%.0f\" $values.A.Value }}s"
          description: "Node {{ $labels.node_id }} in rack {{ $labels.rack_id }} has not published a fresh serving snapshot for {{ printf \"%.0f\" $values.A.Value }} seconds, exceeding the stale threshold of 120 seconds."
          metric_key: stale_age_sec
          current_value: "{{ printf \"%.0f\" $values.A.Value }}"
          threshold: "120"
          unit: "seconds"
          reason_code: stale_snapshot
          observed_window: 120s
          dashboard_url: "/d/monitoring-overview"
          runbook_url: "/docs/runbooks/alerting/node-stale"
        labels:
          source: grafana
          team: infra
          environment: lab
          scope_type: node
          severity: warning
          category: availability
      - uid: node_cpu_temp_critical_v1
        title: NodeCpuTempCritical
        condition: C
        data:
          - refId: A
            datasourceUid: clickhouse
            model:
              datasource:
                type: grafana-clickhouse-datasource
                uid: clickhouse
              editorType: sql
              format: table
              intervalMs: 1000
              maxDataPoints: 43200
              queryType: sql
              rawQuery: true
              rawSql: |
                SELECT
                    node_id,
                    ifNull(dictGet('telemetry_db.dict_node_topology', 'rack_id', node_id), '') AS rack_id,
                    toFloat64(min(cpu_temperature_c_current)) AS alert_value
                FROM telemetry_db.node_summary_trend_1m
                WHERE bucket_start >= toStartOfMinute(now()) - INTERVAL 5 MINUTE
                GROUP BY node_id, rack_id
                HAVING min(cpu_temperature_c_current) > 90
              refId: A
            relativeTimeRange:
              from: 300
              to: 0
          - refId: C
            datasourceUid: __expr__
            model:
              datasource:
                type: __expr__
                uid: __expr__
              expression: $A > 0
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
              type: math
            relativeTimeRange:
              from: 0
              to: 0
        noDataState: OK
        execErrState: Error
        for: 0s
        annotations:
          summary: "Node {{ $labels.node_id }} CPU temperature {{ printf \"%.1f\" $values.A.Value }}C > 90C"
          description: "Node {{ $labels.node_id }} in rack {{ $labels.rack_id }} sustained CPU temperature at or above {{ printf \"%.1f\" $values.A.Value }}C during the last 5 minutes, breaching the 90C critical threshold."
          metric_key: cpu_temperature_c_current
          current_value: "{{ printf \"%.1f\" $values.A.Value }}"
          threshold: "90"
          unit: "celsius"
          reason_code: cpu_temperature_sustained_critical
          observed_window: 5m
          dashboard_url: "/d/monitoring-overview"
          runbook_url: "/docs/runbooks/alerting/node-cpu-temp-critical"
        labels:
          source: grafana
          team: infra
          environment: lab
          scope_type: node
          severity: critical
          category: thermal
      - uid: node_memory_pressure_high_v1
        title: NodeMemoryPressureHigh
        condition: C
        data:
          - refId: A
            datasourceUid: clickhouse
            model:
              datasource:
                type: grafana-clickhouse-datasource
                uid: clickhouse
              editorType: sql
              format: table
              intervalMs: 1000
              maxDataPoints: 43200
              queryType: sql
              rawQuery: true
              rawSql: |
                SELECT
                    node_id,
                    ifNull(dictGet('telemetry_db.dict_node_topology', 'rack_id', node_id), '') AS rack_id,
                    toFloat64(min(memory_used_pct_current)) AS alert_value
                FROM telemetry_db.node_summary_trend_1m
                WHERE bucket_start >= toStartOfMinute(now()) - INTERVAL 5 MINUTE
                GROUP BY node_id, rack_id
                HAVING min(memory_used_pct_current) > 90
              refId: A
            relativeTimeRange:
              from: 300
              to: 0
          - refId: C
            datasourceUid: __expr__
            model:
              datasource:
                type: __expr__
                uid: __expr__
              expression: $A > 0
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
              type: math
            relativeTimeRange:
              from: 0
              to: 0
        noDataState: OK
        execErrState: Error
        for: 0s
        annotations:
          summary: "Node {{ $labels.node_id }} memory usage {{ printf \"%.1f\" $values.A.Value }}% > 90%"
          description: "Node {{ $labels.node_id }} in rack {{ $labels.rack_id }} sustained memory usage at or above {{ printf \"%.1f\" $values.A.Value }} percent during the last 5 minutes, breaching the 90 percent threshold."
          metric_key: memory_used_pct_current
          current_value: "{{ printf \"%.1f\" $values.A.Value }}"
          threshold: "90"
          unit: "percent"
          reason_code: memory_usage_sustained_high
          observed_window: 5m
          dashboard_url: "/d/monitoring-overview"
          runbook_url: "/docs/runbooks/alerting/node-memory-pressure-high"
        labels:
          source: grafana
          team: infra
          environment: lab
          scope_type: node
          severity: critical
          category: resource
      - uid: node_disk_usage_high_v1
        title: NodeDiskUsageHigh
        condition: C
        data:
          - refId: A
            datasourceUid: clickhouse
            model:
              datasource:
                type: grafana-clickhouse-datasource
                uid: clickhouse
              editorType: sql
              format: table
              intervalMs: 1000
              maxDataPoints: 43200
              queryType: sql
              rawQuery: true
              rawSql: |
                SELECT
                    node_id,
                    ifNull(dictGet('telemetry_db.dict_node_topology', 'rack_id', node_id), '') AS rack_id,
                    toFloat64(min(disk_used_pct_max_current)) AS alert_value
                FROM telemetry_db.node_summary_trend_1m
                WHERE bucket_start >= toStartOfMinute(now()) - INTERVAL 10 MINUTE
                GROUP BY node_id, rack_id
                HAVING min(disk_used_pct_max_current) > 85
              refId: A
            relativeTimeRange:
              from: 600
              to: 0
          - refId: C
            datasourceUid: __expr__
            model:
              datasource:
                type: __expr__
                uid: __expr__
              expression: $A > 0
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
              type: math
            relativeTimeRange:
              from: 0
              to: 0
        noDataState: OK
        execErrState: Error
        for: 0s
        annotations:
          summary: "Node {{ $labels.node_id }} disk usage {{ printf \"%.1f\" $values.A.Value }}% > 85%"
          description: "Node {{ $labels.node_id }} in rack {{ $labels.rack_id }} sustained max disk usage at or above {{ printf \"%.1f\" $values.A.Value }} percent during the last 10 minutes, breaching the 85 percent threshold."
          metric_key: disk_used_pct_max_current
          current_value: "{{ printf \"%.1f\" $values.A.Value }}"
          threshold: "85"
          unit: "percent"
          reason_code: disk_usage_sustained_high
          observed_window: 10m
          dashboard_url: "/d/monitoring-overview"
          runbook_url: "/docs/runbooks/alerting/node-disk-usage-high"
        labels:
          source: grafana
          team: infra
          environment: lab
          scope_type: node
          severity: warning
          category: resource
      - uid: node_cpu_usage_high_v1
        title: NodeCpuUsageHigh
        condition: C
        data:
          - refId: A
            datasourceUid: clickhouse
            model:
              datasource:
                type: grafana-clickhouse-datasource
                uid: clickhouse
              editorType: sql
              format: table
              intervalMs: 1000
              maxDataPoints: 43200
              queryType: sql
              rawQuery: true
              rawSql: |
                SELECT
                    node_id,
                    ifNull(dictGet('telemetry_db.dict_node_topology', 'rack_id', node_id), '') AS rack_id,
                    toFloat64(min(cpu_usage_pct_current)) AS alert_value
                FROM telemetry_db.node_summary_trend_1m
                WHERE bucket_start >= toStartOfMinute(now()) - INTERVAL 5 MINUTE
                GROUP BY node_id, rack_id
                HAVING min(cpu_usage_pct_current) > 90
              refId: A
            relativeTimeRange:
              from: 300
              to: 0
          - refId: C
            datasourceUid: __expr__
            model:
              datasource:
                type: __expr__
                uid: __expr__
              expression: $A > 0
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
              type: math
            relativeTimeRange:
              from: 0
              to: 0
        noDataState: OK
        execErrState: Error
        for: 0s
        annotations:
          summary: "Node {{ $labels.node_id }} CPU usage {{ printf \"%.1f\" $values.A.Value }}% > 90%"
          description: "Node {{ $labels.node_id }} in rack {{ $labels.rack_id }} sustained CPU usage at or above {{ printf \"%.1f\" $values.A.Value }} percent during the last 5 minutes, breaching the 90 percent threshold."
          metric_key: cpu_usage_pct_current
          current_value: "{{ printf \"%.1f\" $values.A.Value }}"
          threshold: "90"
          unit: "percent"
          reason_code: cpu_usage_sustained_high
          observed_window: 5m
          dashboard_url: "/d/monitoring-overview"
          runbook_url: "/docs/runbooks/alerting/node-cpu-usage-high"
        labels:
          source: grafana
          team: infra
          environment: lab
          scope_type: node
          severity: critical
          category: resource
      - uid: node_packet_loss_high_v1
        title: NodePacketLossHigh
        condition: C
        data:
          - refId: A
            datasourceUid: clickhouse
            model:
              datasource:
                type: grafana-clickhouse-datasource
                uid: clickhouse
              editorType: sql
              format: table
              intervalMs: 1000
              maxDataPoints: 43200
              queryType: sql
              rawQuery: true
              rawSql: |
                SELECT
                    node_id,
                    ifNull(dictGet('telemetry_db.dict_node_topology', 'rack_id', node_id), '') AS rack_id,
                    toFloat64(min(tcp_retransmit_pct_max_current)) AS alert_value
                FROM telemetry_db.node_summary_trend_1m
                WHERE bucket_start >= toStartOfMinute(now()) - INTERVAL 5 MINUTE
                GROUP BY node_id, rack_id
                HAVING min(tcp_retransmit_pct_max_current) > 5
              refId: A
            relativeTimeRange:
              from: 300
              to: 0
          - refId: C
            datasourceUid: __expr__
            model:
              datasource:
                type: __expr__
                uid: __expr__
              expression: $A > 0
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
              type: math
            relativeTimeRange:
              from: 0
              to: 0
        noDataState: OK
        execErrState: Error
        for: 0s
        annotations:
          summary: "Node {{ $labels.node_id }} packet retransmit {{ printf \"%.1f\" $values.A.Value }}% > 5%"
          description: "Node {{ $labels.node_id }} in rack {{ $labels.rack_id }} sustained TCP retransmit at or above {{ printf \"%.1f\" $values.A.Value }} percent during the last 5 minutes, indicating likely packet loss or network degradation beyond the 5 percent warning threshold."
          metric_key: tcp_retransmit_pct_max_current
          current_value: "{{ printf \"%.1f\" $values.A.Value }}"
          threshold: "5"
          unit: "percent"
          reason_code: tcp_retransmit_sustained_high
          observed_window: 5m
          dashboard_url: "/d/monitoring-overview"
          runbook_url: "/docs/runbooks/alerting/node-packet-loss-high"
        labels:
          source: grafana
          team: infra
          environment: lab
          scope_type: node
          severity: warning
          category: network

  - orgId: 1
    name: monitoring_runtime_v1
    folder: delegated-alerting-v1
    interval: 60s
    rules:
      - uid: container_unhealthy_present_v1
        title: ContainerUnhealthyPresent
        condition: C
        data:
          - refId: A
            datasourceUid: clickhouse
            model:
              datasource:
                type: grafana-clickhouse-datasource
                uid: clickhouse
              editorType: sql
              format: table
              intervalMs: 1000
              maxDataPoints: 43200
              queryType: sql
              rawQuery: true
              rawSql: |
                SELECT
                    node_id,
                    ifNull(dictGet('telemetry_db.dict_node_topology', 'rack_id', node_id), '') AS rack_id,
                    toFloat64(countIf(lower(container_health_status) = 'unhealthy')) AS alert_value
                FROM telemetry_db.container_current_summary
                GROUP BY node_id, rack_id
                HAVING countIf(lower(container_health_status) = 'unhealthy') > 0
              refId: A
            relativeTimeRange:
              from: 60
              to: 0
          - refId: C
            datasourceUid: __expr__
            model:
              datasource:
                type: __expr__
                uid: __expr__
              expression: $A > 0
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
              type: math
            relativeTimeRange:
              from: 0
              to: 0
        noDataState: OK
        execErrState: Error
        for: 0s
        annotations:
          summary: "Node {{ $labels.node_id }} has {{ printf \"%.0f\" $values.A.Value }} unhealthy container(s)"
          description: "Node {{ $labels.node_id }} in rack {{ $labels.rack_id }} currently has {{ printf \"%.0f\" $values.A.Value }} container(s) reporting unhealthy status in the latest serving snapshot."
          metric_key: unhealthy_container_count
          current_value: "{{ printf \"%.0f\" $values.A.Value }}"
          threshold: "1"
          unit: "containers"
          reason_code: unhealthy_containers_present
          observed_window: current-snapshot
          dashboard_url: "/d/monitoring-overview"
          runbook_url: "/docs/runbooks/alerting/container-unhealthy-present"
        labels:
          source: grafana
          team: infra
          environment: lab
          scope_type: node
          severity: warning
          category: runtime
      - uid: container_restarting_v1
        title: ContainerRestarting
        condition: C
        data:
          - refId: A
            datasourceUid: clickhouse
            model:
              datasource:
                type: grafana-clickhouse-datasource
                uid: clickhouse
              editorType: sql
              format: table
              intervalMs: 1000
              maxDataPoints: 43200
              queryType: sql
              rawQuery: true
              rawSql: |
                SELECT
                    container_id AS workload_id,
                    node_id,
                    ifNull(dictGet('telemetry_db.dict_node_topology', 'rack_id', node_id), '') AS rack_id,
                    toFloat64(restart_count_current) AS alert_value
                FROM telemetry_db.container_current_summary
                WHERE restart_count_current > 0
              refId: A
            relativeTimeRange:
              from: 60
              to: 0
          - refId: C
            datasourceUid: __expr__
            model:
              datasource:
                type: __expr__
                uid: __expr__
              expression: $A > 0
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
              type: math
            relativeTimeRange:
              from: 0
              to: 0
        noDataState: OK
        execErrState: Error
        for: 0s
        annotations:
          summary: "Workload {{ $labels.workload_id }} restart count is {{ printf \"%.0f\" $values.A.Value }}"
          description: "Workload {{ $labels.workload_id }} on node {{ $labels.node_id }} in rack {{ $labels.rack_id }} currently reports restart_count_current={{ printf \"%.0f\" $values.A.Value }}, which is above zero."
          metric_key: restart_count_current
          current_value: "{{ printf \"%.0f\" $values.A.Value }}"
          threshold: "0"
          unit: "restarts"
          reason_code: workload_restarting
          observed_window: current-snapshot
          dashboard_url: "/d/monitoring-overview"
          runbook_url: "/docs/runbooks/alerting/container-restarting"
        labels:
          source: grafana
          team: infra
          environment: lab
          scope_type: workload
          severity: warning
          category: runtime
      - uid: service_partial_outage_v1
        title: ServicePartialOutage
        condition: C
        data:
          - refId: A
            datasourceUid: clickhouse
            model:
              datasource:
                type: grafana-clickhouse-datasource
                uid: clickhouse
              editorType: sql
              format: table
              intervalMs: 1000
              maxDataPoints: 43200
              queryType: sql
              rawQuery: true
              rawSql: |
                SELECT
                    `s.service_id` AS workload_id,
                    service_name,
                    toString(toInt64(service_running_container_count_current)) AS running_replicas,
                    toString(toInt64(service_container_count_current)) AS expected_replicas,
                    toFloat64(round(running_container_ratio_current * 100, 1)) AS alert_value
                FROM telemetry_db.service_current_summary
                WHERE service_container_count_current > 0
                  AND service_running_container_count_current > 0
                  AND service_running_container_count_current < service_container_count_current
              refId: A
            relativeTimeRange:
              from: 60
              to: 0
          - refId: C
            datasourceUid: __expr__
            model:
              datasource:
                type: __expr__
                uid: __expr__
              expression: $A > 0
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
              type: math
            relativeTimeRange:
              from: 0
              to: 0
        noDataState: OK
        execErrState: Error
        for: 0s
        annotations:
          summary: "Service {{ $labels.service_name }} running {{ $labels.running_replicas }} / {{ $labels.expected_replicas }} containers"
          description: "Service {{ $labels.service_name }} currently has only {{ $labels.running_replicas }} of {{ $labels.expected_replicas }} expected containers running, leaving capacity at {{ printf \"%.1f\" $values.A.Value }} percent."
          metric_key: running_container_ratio_current
          current_value: "{{ printf \"%.1f\" $values.A.Value }}"
          threshold: "100"
          unit: "percent-of-expected-capacity"
          reason_code: service_partial_outage
          observed_window: current-snapshot
          dashboard_url: "/d/monitoring-overview"
          runbook_url: "/docs/runbooks/alerting/service-partial-outage"
        labels:
          source: grafana
          team: infra
          environment: lab
          scope_type: service
          severity: warning
          category: availability

  - orgId: 1
    name: monitoring_rack_health_v1
    folder: delegated-alerting-v1
    interval: 60s
    rules:
      - uid: rack_critical_v1
        title: RackCritical
        condition: C
        data:
          - refId: A
            datasourceUid: clickhouse
            model:
              datasource:
                type: grafana-clickhouse-datasource
                uid: clickhouse
              editorType: sql
              format: table
              intervalMs: 1000
              maxDataPoints: 43200
              queryType: sql
              rawQuery: true
              rawSql: |
                SELECT
                    rack_id,
                    toFloat64(
                        if(
                            critical_nodes > 0,
                            critical_nodes,
                            if(
                                stale_nodes > 0,
                                stale_nodes,
                                if(is_rack_level_failure = 1 OR has_signal_loss = 1, 1, 0)
                            )
                        )
                    ) AS alert_value
                FROM telemetry_db.rack_current_summary
                WHERE is_rack_level_failure = 1
                   OR critical_nodes > 0
                   OR has_signal_loss = 1
              refId: A
            relativeTimeRange:
              from: 60
              to: 0
          - refId: C
            datasourceUid: __expr__
            model:
              datasource:
                type: __expr__
                uid: __expr__
              expression: $A > 0
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
              type: math
            relativeTimeRange:
              from: 0
              to: 0
        noDataState: OK
        execErrState: Error
        for: 0s
        annotations:
          summary: "Rack {{ $labels.rack_id }} critical with impact value {{ printf \"%.0f\" $values.A.Value }}"
          description: "Rack {{ $labels.rack_id }} is critical. Impact value={{ printf \"%.0f\" $values.A.Value }} where the value represents critical_nodes first, then stale_nodes, and falls back to 1 for rack-level failure or signal loss."
          metric_key: rack_impact_value
          current_value: "{{ printf \"%.0f\" $values.A.Value }}"
          threshold: "1"
          unit: "impact-count"
          reason_code: rack_failure_or_critical_nodes_or_signal_loss
          observed_window: current-snapshot
          dashboard_url: "/d/monitoring-overview"
          runbook_url: "/docs/runbooks/alerting/rack-critical"
        labels:
          source: grafana
          team: infra
          environment: lab
          scope_type: rack
          severity: critical
          category: availability
      - uid: rack_signal_loss_present_v1
        title: RackSignalLossPresent
        condition: C
        data:
          - refId: A
            datasourceUid: clickhouse
            model:
              datasource:
                type: grafana-clickhouse-datasource
                uid: clickhouse
              editorType: sql
              format: table
              intervalMs: 1000
              maxDataPoints: 43200
              queryType: sql
              rawQuery: true
              rawSql: |
                SELECT
                    rack_id,
                    toFloat64(if(silent_dead_nodes > 0, silent_dead_nodes, stale_nodes)) AS alert_value,
                    toString(toInt64(silent_dead_nodes)) AS silent_dead_nodes_label,
                    toString(toInt64(stale_nodes)) AS stale_nodes_label
                FROM telemetry_db.rack_current_summary
                WHERE has_signal_loss = 1
                  AND rack_id != ''
                  AND lowerUTF8(rack_id) != 'null'
              refId: A
            relativeTimeRange:
              from: 60
              to: 0
          - refId: C
            datasourceUid: __expr__
            model:
              datasource:
                type: __expr__
                uid: __expr__
              expression: $A > 0
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
              type: math
            relativeTimeRange:
              from: 0
              to: 0
        noDataState: OK
        execErrState: Error
        for: 0s
        annotations:
          summary: "Rack {{ $labels.rack_id }} signal loss with {{ $labels.silent_dead_nodes_label }} silent node(s)"
          description: "Rack {{ $labels.rack_id }} is reporting signal loss. Silent nodes={{ $labels.silent_dead_nodes_label }}, stale nodes={{ $labels.stale_nodes_label }}, which indicates rack-level connectivity degradation or missing telemetry."
          metric_key: has_signal_loss
          current_value: "{{ printf \"%.0f\" $values.A.Value }}"
          threshold: "1"
          unit: "affected-nodes"
          reason_code: rack_signal_loss_present
          observed_window: current-snapshot
          dashboard_url: "/d/monitoring-overview"
          runbook_url: "/docs/runbooks/alerting/rack-signal-loss-present"
        labels:
          source: grafana
          team: infra
          environment: lab
          scope_type: rack
          severity: critical
          category: connectivity
