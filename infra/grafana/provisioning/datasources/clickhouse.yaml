apiVersion: 1

deleteDatasources:
  - name: ClickHouse
    orgId: 1

datasources:
  - name: ClickHouse
    uid: clickhouse
    type: grafana-clickhouse-datasource
    access: proxy
    isDefault: true
    editable: true

    jsonData:
      host: clickhouse
      port: 9000
      protocol: native
      username: root
      defaultDatabase: telemetry_db
      tlsSkipVerify: false

    secureJsonData:
      password: password