syntax = "proto3";

package api.registration.v1;
option go_package = "github.com/iSenity1812/ingestion-worker-contract/api/registration/v1;registrationpb";

service RegistrationService {
  rpc RegisterNode (RegisterNodeRequest) returns (RegisterNodeResponse);
}

message HardwareInfo {
  string primary_ipv4 = 1;
  string mac_address = 2;
  string hardware_serial = 3;
  string vendor = 4;
  string model = 5;
  string os_product = 6;
  int32 logical_cpu_count = 7;
  string cpu_architecture = 8;
}

message RegisterNodeRequest {
  string bootstrap_token = 1;
  string hostname = 2;
  string device_type = 3;
  string discovery_source = 4;
  HardwareInfo hardware_info = 5;
}

message RegisterNodeResponse {
  string agent_id = 1;
  bytes certificate = 2; // Chuỗi PEM chứa chứng chỉ X.509
  bytes private_key = 3; // Chuỗi PEM chứa khóa riêng RSA
}
