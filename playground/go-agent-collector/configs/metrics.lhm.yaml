lhmMetrics:
  - category: hardware_health
    key: node.cpu_temperature_c
    status: draft
    enabled: true
    sourceMetric: lhm.cpu.temperature
    scopeType: node
    unit: C
    valueType: gauge
    aggregation: direct
    notes: CPU package temperature from LibreHardwareMonitor.

  - category: hardware_health
    key: node.cpu_package_power_w
    status: draft
    enabled: true
    sourceMetric: lhm.cpu.package_power
    scopeType: node
    unit: W
    valueType: gauge
    aggregation: direct
    notes: CPU package power from LibreHardwareMonitor.

  - category: hardware_health
    key: node.gpu_core_load_pct
    status: draft
    enabled: true
    sourceMetric: lhm.gpu.core_load
    scopeType: node
    unit: "%"
    valueType: gauge
    aggregation: direct
    keepLabels:
      - gpu
      - gpu_index
    notes: GPU utilization per detected GPU.

  - category: hardware_health
    key: node.gpu_core_clock_mhz
    status: draft
    enabled: true
    sourceMetric: lhm.gpu.core_clock
    scopeType: node
    unit: MHz
    valueType: gauge
    aggregation: direct
    keepLabels:
      - gpu
      - gpu_index
    notes: GPU core clock per detected GPU.

  - category: hardware_health
